name: Gate

# The gate on every push (CLAUDE.md: the build order, layer 0): the full gate, mutation testing included, in a clean clone.
on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-24.04
    # In SLATE, mutation testing reran the suite for each of some 8,300 mutants: about two hours on a 4-core runner (2026-10-28).
    # By 2026-10-31 there were 16,561 and the run took 175 minutes; run 505 was cancelled at the 180 it was given. A
    # GitHub-hosted job may run 360.
    timeout-minutes: 340
    # The actions are pinned to exact releases, as every package is, each confirmed in its own repository on
    # 2026-11-02 to run on Node.js 24 (v4 targeted Node.js 20, which GitHub had stopped running). setup-node from v6
    # caches npm's downloads on its own, because package.json names npm in packageManager; `npm ci` still installs
    # exactly what the lockfile holds.
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The layer ledger's proofs name commits; the gate checks this branch carries them.
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npx -y npm@11.6.2 ci
      - name: The full gate
        run: |
          set +e
          npm run gate:full
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "::warning::The gate is incomplete: declared work is unfinished, so no layer can be proven on this commit."
            exit 0
          fi
          exit $code
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: gate-receipt
          path: |
            .gate/receipt.json
            reports/mutation/
